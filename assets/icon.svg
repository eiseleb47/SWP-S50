<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#1c2660"/>
      <stop offset="100%" stop-color="#06080f"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (rounded square, like modern app icons) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Background star field -->
  <circle cx="78"  cy="88"  r="1.8" fill="#c8d4ff" opacity="0.60"/>
  <circle cx="168" cy="52"  r="1.4" fill="#ffffff"  opacity="0.50"/>
  <circle cx="312" cy="44"  r="1.8" fill="#e0e8ff"  opacity="0.50"/>
  <circle cx="462" cy="78"  r="1.5" fill="#ffffff"  opacity="0.40"/>
  <circle cx="492" cy="198" r="1.5" fill="#c8d4ff"  opacity="0.45"/>
  <circle cx="48"  cy="282" r="1.5" fill="#ffffff"  opacity="0.35"/>
  <circle cx="28"  cy="402" r="1.8" fill="#c8d4ff"  opacity="0.40"/>
  <circle cx="492" cy="422" r="1.5" fill="#ffffff"  opacity="0.35"/>
  <circle cx="198" cy="476" r="1.5" fill="#c8d4ff"  opacity="0.40"/>
  <circle cx="382" cy="472" r="1.8" fill="#ffffff"  opacity="0.35"/>
  <circle cx="462" cy="342" r="1.4" fill="#ffffff"  opacity="0.30"/>
  <circle cx="130" cy="460" r="1.4" fill="#c8d4ff"  opacity="0.30"/>

  <!-- Target bright star with glow (upper-right quadrant) -->
  <circle cx="382" cy="106" r="42" fill="#ffd060" opacity="0.10" filter="url(#glow)"/>
  <circle cx="382" cy="106" r="15" fill="#ffd060" opacity="0.45"/>
  <circle cx="382" cy="106" r="7"  fill="#fff8d0"/>
  <!-- Diffraction spikes -->
  <line x1="382" y1="80"  x2="382" y2="132" stroke="#ffd060" stroke-width="1.5" opacity="0.38"/>
  <line x1="356" y1="106" x2="408" y2="106" stroke="#ffd060" stroke-width="1.5" opacity="0.38"/>
  <line x1="364" y1="88"  x2="400" y2="124" stroke="#ffd060" stroke-width="1"   opacity="0.20"/>
  <line x1="400" y1="88"  x2="364" y2="124" stroke="#ffd060" stroke-width="1"   opacity="0.20"/>

  <!-- Telescope tube pointing upper-right toward the star -->
  <g transform="translate(212,298) rotate(-43)">
    <!-- Main tube body -->
    <rect x="-29" y="-140" width="58" height="188" rx="13" fill="#3a5e96"/>
    <!-- Left-edge highlight for depth -->
    <rect x="-21" y="-140" width="11" height="188" rx="6"  fill="#4d74ab" opacity="0.50"/>
    <!-- Focus/dew-shield bands -->
    <rect x="-31" y="-94" width="62" height="11" rx="3" fill="#243b61"/>
    <rect x="-31" y="-36" width="62" height="11" rx="3" fill="#243b61"/>
    <!-- Objective lens housing (top) -->
    <ellipse cx="0" cy="-140" rx="29" ry="10"  fill="#2a4878"/>
    <ellipse cx="0" cy="-140" rx="22" ry="7.5" fill="#070e1e"/>
    <!-- Lens coating reflection -->
    <ellipse cx="-7" cy="-143" rx="9" ry="2.8" fill="#76b4ee" opacity="0.70"
             transform="rotate(-18,-7,-143)"/>
    <!-- Eyepiece housing (bottom) -->
    <rect x="-17" y="48"  width="34" height="26" rx="7" fill="#243b61"/>
    <rect x="-11" y="64"  width="22" height="13" rx="3" fill="#111b2c"/>
  </g>

  <!-- Alt-azimuth mount head -->
  <ellipse cx="212" cy="328" rx="32" ry="9"  fill="#2a4878" opacity="0.90"/>
  <rect    x="194"  y="324"  width="36" height="30" rx="8" fill="#243b61"/>

  <!-- Tripod legs -->
  <line x1="212" y1="354" x2="144" y2="460" stroke="#243b61" stroke-width="14" stroke-linecap="round"/>
  <line x1="212" y1="354" x2="280" y2="460" stroke="#243b61" stroke-width="14" stroke-linecap="round"/>
  <line x1="212" y1="354" x2="212" y2="464" stroke="#243b61" stroke-width="12" stroke-linecap="round"/>

  <!-- Tripod feet -->
  <ellipse cx="144" cy="460" rx="16" ry="5" fill="#1a2c48"/>
  <ellipse cx="280" cy="460" rx="16" ry="5" fill="#1a2c48"/>
  <ellipse cx="212" cy="464" rx="14" ry="5" fill="#1a2c48"/>
</svg>
